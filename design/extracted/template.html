   The three proprietary faces (WiredDisplay, BreveText, Apercu) cannot be

/* Ashesi Research Club — Color tokens
   Strict black-on-white duet. Black is reserved for the wordmark, every CTA,
   and the footer fill. The only chromatic accent is the inline link blue,
   which appears ONLY inside article body text. */

:root {
  /* ---- Base ink & canvas ---- */
  --ink: #000000;          /* pure black — wordmark, CTAs, footer fill, body text */
  --canvas: #ffffff;       /* pure white — the page */

  /* ---- Neutral hairlines & quiet text ---- */
  --hairline: #e0e0e0;     /* 1px dividers — the ONLY way hierarchy is drawn besides surface contrast */
  --hairline-strong: #000000; /* full-black 1px border on inputs & cards when emphasis is needed */
  --muted: #6b6b6b;        /* metadata, captions, fine print (sans) */
  --muted-2: #8c8c8c;      /* even quieter — placeholder text, disabled labels */
  --tint-warm: #f7f4ee;    /* optional warm reading tint (reader setting / aside blocks) */
  --tint-paper: #faf9f6;   /* near-white paper for callout & pull-quote backgrounds */

  /* ---- The single accent ---- */
  --link: #057dbc;         /* inline link blue — body copy links ONLY */
  --link-hover: #046294;   /* darker on hover */

  /* ---- Reader dark mode (article column only) ---- */
  --dark-bg: #111111;
  --dark-ink: #f2f2f2;
  --dark-hairline: #333333;
  --dark-muted: #9a9a9a;

  /* ---- Category accents ----
     DECISION: "no chromatic accent" wins. Categories render as plain sans
     uppercase labels. These hues exist ONLY for an optional 8px leading dot
     on category eyebrows where a faint signal is wanted — never as fills,
     never as text color. Keep them desaturated and editorial. */
  --cat-computer-science: #057dbc;
  --cat-engineering: #b4541f;
  --cat-business: #1f7a4d;
  --cat-social-sciences: #6a4bb0;
  --cat-humanities: #9c5a00;
  --cat-interdisciplinary: #4a4a4a;
  --cat-other: #6b6b6b;

  /* ---- Semantic aliases ---- */
  --text-body: var(--ink);
  --text-strong: var(--ink);
  --text-muted: var(--muted);
  --text-link: var(--link);
  --surface-page: var(--canvas);
  --surface-card: var(--canvas);
  --surface-footer: var(--ink);
  --surface-tint: var(--tint-paper);
  --border-hairline: var(--hairline);
  --border-strong: var(--ink);
  --on-ink: var(--canvas);  /* text on a black surface */
}

/* Ashesi Research Club — Typography tokens
   Three type roles, strictly separated:
     DISPLAY (serif)  Playfair Display 400 — headlines, standfirsts. Never buttons/nav.
     BODY    (serif)  Lora               — article narrative ONLY.
     SANS             Inter              — structure, metadata, labels, nav, buttons, captions.
     MONO             JetBrains Mono     — code blocks. */

:root {
  /* ---- Families ---- */
  --font-display: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --font-body: 'Lora', Georgia, 'Times New Roman', serif;
  --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* ---- Display scale (serif, weight 400) ---- */
  --display-hero: 64px;     /* home cover & article H1 at desktop (scales to 40 on mobile) */
  --display-hero-mobile: 40px;
  --display-1: 44px;        /* section heads, big features */
  --display-2: 32px;        /* heading-2 in body */
  --display-3: 24px;        /* heading-3 in body, secondary card headings */
  --display-line: 1.08; /* @kind other */
  --display-weight: 400;    /* NEVER bolder for display */

  /* ---- Body scale (serif, Lora) ---- */
  --body-standfirst: 22px;  /* excerpt / standfirst under headline */
  --body-lead: 19px;        /* lead paragraph in article column */
  --body-base: 17px;        /* default article paragraph */
  --body-small: 15px;
  --body-line: 1.62; /* @kind other */
  --body-line-tight: 1.45; /* @kind other */

  /* ---- Sans scale (Inter — structure & metadata) ---- */
  --sans-nav: 14px;         /* nav links, Apercu 14/700 → Inter 14/700 */
  --sans-label: 13px;       /* eyebrows, category labels (uppercase, tracked) */
  --sans-meta: 14px;        /* byline, read time, captions */
  --sans-small: 12px;       /* fine print, tags */
  --sans-button: 14px;
  --sans-weight-reg: 400;
  --sans-weight-med: 500;
  --sans-weight-semi: 600;
  --sans-weight-bold: 700;

  /* ---- Tracking ---- */
  --track-label: 0.12em;    /* uppercase eyebrows & labels */
  --track-tight: -0.01em;   /* large display */
  --track-normal: 0; /* @kind other */

  /* ---- Mono ---- */
  --mono-base: 14px;
  --mono-line: 1.55; /* @kind other */

  /* ---- Semantic aliases ---- */
  --text-display: var(--font-display);
  --text-narrative: var(--font-body);
  --text-ui: var(--font-sans);
  --text-code: var(--font-mono);
}

/* Ashesi Research Club — Spacing tokens
   8px base grid. Editorial layouts breathe; use generous vertical rhythm
   and wide gutters. Footer uses 48px vertical padding (brief). */

:root {
  --space-0: 0px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;     /* footer vertical padding, section gaps */
  --space-8: 64px;
  --space-9: 96px;
  --space-10: 128px;

  /* ---- Layout ---- */
  --container-max: 1200px;     /* magazine grid max width */
  --reading-max: 680px;        /* article reading column — the calm center */
  --gutter-desktop: 48px;
  --gutter-mobile: 20px;
  --row-gap: 32px;

  /* ---- Touch ---- */
  --touch-min: 44px;           /* minimum hit target */

  /* ---- Semantic aliases ---- */
  --pad-page-x: var(--gutter-desktop);
  --pad-section-y: var(--space-9);
  --pad-footer-y: var(--space-7);
  --gap-grid: var(--space-7);
}

/* Ashesi Research Club — Shape, border & elevation tokens
   SQUARE CORNERS EVERYWHERE. rounded.none (0px) on buttons, inputs, cards,
   pills, tags. The ONLY round shape is rounded.full for circular avatars
   and circular icon buttons. NO drop-shadows — hierarchy is carried by
   surface contrast and 1px #e0e0e0 hairlines only. */

:root {
  /* ---- Radii ---- */
  --radius-none: 0px;        /* the signature: everything square */
  --radius-full: 9999px;     /* circular avatars & icon buttons ONLY */

  /* ---- Borders ---- */
  --border-width: 1px;
  --border-hair: 1px solid var(--hairline);   /* dividers, quiet separators */
  --border-ink: 1px solid var(--ink);         /* inputs, primary outlines, cards needing edge */
  --border-thick: 2px solid var(--ink);       /* active filter pill, focus emphasis */

  /* ---- Elevation ---- */
  --shadow-none: none;       /* there are NO shadows in this system */
  --elevation: none;

  /* ---- Focus ---- */
  --focus-ring: 2px solid var(--ink);
  --focus-offset: 2px;

  /* ---- Motion (restrained, editorial) ----
     Featured moments only. Calm fades & short slides; no bounce. */
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1); /* @kind other */
  --dur-fast: 120ms; /* @kind other */
  --dur-base: 240ms; /* @kind other */
  --dur-slow: 600ms; /* @kind other */
}

/* Ashesi Research Club — Base resets & a few editorial primitives.
   Kept minimal: the system is mostly tokens + components. */

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--surface-page);
  color: var(--text-body);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ---- Type role helpers (use directly in cards/kits) ---- */
.arc-display {
  font-family: var(--font-display);
  font-weight: var(--display-weight);
  line-height: var(--display-line);
  letter-spacing: var(--track-tight);
  color: var(--ink);
}
.arc-body {
  font-family: var(--font-body);
  font-size: var(--body-base);
  line-height: var(--body-line);
  color: var(--ink);
}
.arc-eyebrow {
  font-family: var(--font-sans);
  font-size: var(--sans-label);
  font-weight: var(--sans-weight-bold);
  letter-spacing: var(--track-label);
  text-transform: uppercase;
  color: var(--ink);
}
.arc-meta {
  font-family: var(--font-sans);
  font-size: var(--sans-meta);
  color: var(--muted);
}

/* ---- Inline article link — the only chromatic accent ---- */
.arc-link {
  color: var(--link);
  text-decoration: underline;
  text-underline-offset: 2px;
  text-decoration-thickness: 1px;
  transition: color var(--dur-fast) var(--ease-out);
}
.arc-link:hover { color: var(--link-hover); }

/* ---- Hairline rule ---- */
.arc-rule { border: 0; border-top: var(--border-hair); margin: 0; }

/* ---- Component interaction states ----
   Hover = subtle surface shift; press = slight darken/translate. Restrained. */
.arc-button[data-variant="primary"]:hover { background: #1c1c1c; }
.arc-button[data-variant="primary"]:active { background: #000; transform: translateY(1px); }
.arc-button[data-variant="secondary"]:hover { background: var(--ink); color: var(--on-ink); }
.arc-button[data-variant="secondary"]:active { transform: translateY(1px); }
.arc-button[data-variant="text"]:hover { color: var(--muted); }

<script type="text/babel">
  function App() {
    const [route, setRoute] = React.useState({ name: 'home', param: null });
    const go = (name, param = null) => { setRoute({ name, param }); window.scrollTo(0, 0); };
    const openArticle = (slug) => go('article', slug);

    let screen, hideFooter = false;
    switch (route.name) {
      case 'article': screen = <window.Article slug={route.param} onNav={go} />; hideFooter = true; break;
      case 'apply': screen = <window.Apply onNav={go} />; break;
      case 'articles': screen = <window.Archive onOpenArticle={openArticle} />; break;
      case 'team': screen = <window.Team onNav={go} />; break;
      case 'researchers':
      case 'researcher': screen = <window.Researcher slug={route.param || 'isaac-osei-nyantakyi'} onNav={go} onOpenArticle={openArticle} />; break;
      case 'about': screen = <window.Archive onOpenArticle={openArticle} />; break;
      default: screen = <window.Home onNav={go} onOpenArticle={openArticle} />;
    }
    const active = route.name === 'article' ? 'articles' : route.name === 'researcher' ? 'researchers' : route.name;
    return (
      <div>
        <window.Masthead onNav={go} active={active} onApply={() => go('apply')} />
        {screen}
        {!hideFooter && <window.Footer onNav={go} />}
      </div>
    );
  }
  const _root = ReactDOM.createRoot(document.getElementById('root'));
  function mount() {
    if (!window.AshesiResearchClubDesignSystem_cd232d || !window.Home) {
      _root.render(
        <div style={{ minHeight: '60vh', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'var(--font-sans)', fontSize: 14, color: '#6b6b6b' }}>
          Loading components…
        </div>
      );
      return setTimeout(mount, 300);
    }
    _root.render(<App />);
  }
  mount();
</script>
